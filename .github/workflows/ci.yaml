name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generated code, CRDs and RBAC are up to date
        run: make verify
      - name: Unit + multi-cluster envtest suite (race detector on)
        run: make test
      - name: Known vulnerabilities in dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Demo runs end to end
        run: make demo

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: make docker-build IMG=fleetwave:ci
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fleetwave:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
