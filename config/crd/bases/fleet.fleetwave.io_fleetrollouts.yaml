---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: fleetrollouts.fleet.fleetwave.io
spec:
  group: fleet.fleetwave.io
  names:
    kind: FleetRollout
    listKind: FleetRolloutList
    plural: fleetrollouts
    shortNames:
    - fr
    singular: fleetrollout
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.currentWave
      name: Wave
      type: string
    - jsonPath: .status.totalWaves
      name: Waves
      type: string
    - jsonPath: .status.revision
      name: Revision
      type: string
    - jsonPath: .status.stableRevision
      name: Stable
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          FleetRollout rolls a set of Kubernetes resources across a fleet of member
          clusters in health-gated waves, with automatic rollback.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FleetRolloutSpec is the desired state of a FleetRollout.
            properties:
              clusterSelector:
                description: |-
                  ClusterSelector selects MemberClusters by label. An empty selector
                  selects every cluster.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy for resources in member clusters when this object is
                  deleted.
                enum:
                - Delete
                - Orphan
                type: string
              paused:
                description: |-
                  Paused stops new clusters from receiving the revision. Health is still
                  tracked and failures are still acted on.
                type: boolean
              resources:
                description: |-
                  Resources are Kubernetes objects applied to every selected cluster with
                  server-side apply. Namespaced objects must set metadata.namespace.
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                minItems: 1
                type: array
              strategy:
                default: {}
                description: Strategy controls waves, bake time and failure handling.
                properties:
                  autoRollback:
                    default: true
                    description: |-
                      AutoRollback re-applies the last revision that succeeded fleet-wide to
                      every cluster that received the failed revision.
                    type: boolean
                  bakeTime:
                    default: 60s
                    description: |-
                      BakeTime is how long a completed wave must stay healthy before the next
                      wave starts. Clusters that regress during the bake fail the rollout.
                    type: string
                  maxFailures:
                    description: |-
                      MaxFailures is the number of failed clusters tolerated before the
                      rollout halts. The default of 0 halts on the first failure.
                    format: int32
                    minimum: 0
                    type: integer
                  progressDeadline:
                    default: 5m
                    description: |-
                      ProgressDeadline is how long a cluster may take to become healthy after
                      a revision is applied before it is marked Failed.
                    type: string
                  waves:
                    default:
                    - "1"
                    - 50%
                    - 100%
                    description: |-
                      Waves are cumulative targets, as a cluster count ("1") or a percentage
                      of selected clusters ("25%"). Percentages round up. The last wave is
                      always widened to 100% so a rollout cannot finish half done.
                    items:
                      anyOf:
                      - type: integer
                      - type: string
                      x-kubernetes-int-or-string: true
                    minItems: 1
                    type: array
                type: object
            required:
            - clusterSelector
            - resources
            type: object
          status:
            description: FleetRolloutStatus is the observed state of a FleetRollout.
            properties:
              clusters:
                description: Clusters lists per-cluster progress, in wave order.
                items:
                  description: ClusterRolloutStatus is the state of one cluster.
                  properties:
                    appliedAt:
                      description: AppliedAt is when Revision was applied.
                      format: date-time
                      type: string
                    message:
                      description: Message explains the state.
                      type: string
                    name:
                      description: Name of the MemberCluster.
                      type: string
                    revision:
                      description: Revision currently applied to the cluster by this
                        rollout.
                      type: string
                    state:
                      description: State of the cluster for the desired revision.
                      enum:
                      - Pending
                      - Progressing
                      - Healthy
                      - Failed
                      - RolledBack
                      - Skipped
                      type: string
                    wave:
                      description: Wave the cluster belongs to (0-based).
                      format: int32
                      type: integer
                  required:
                  - name
                  - state
                  - wave
                  type: object
                type: array
              conditions:
                description: 'Conditions: Ready, Progressing, Degraded.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentWave:
                description: CurrentWave is the wave being rolled out (0-based).
                format: int32
                type: integer
              message:
                description: Message is a human-readable summary.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation this status describes.
                format: int64
                type: integer
              phase:
                description: Phase of the rollout.
                enum:
                - Progressing
                - Baking
                - Paused
                - Succeeded
                - Halted
                - RolledBack
                - Invalid
                type: string
              revision:
                description: Revision is the content hash of spec.resources being
                  rolled out.
                type: string
              stableRevision:
                description: |-
                  StableRevision is the last revision that reached every selected cluster.
                  It is the rollback target.
                type: string
              totalWaves:
                description: TotalWaves after resolving percentages against the selected
                  clusters.
                format: int32
                type: integer
              waveCompletedAt:
                description: |-
                  WaveCompletedAt is when every cluster in CurrentWave became healthy.
                  The next wave starts once BakeTime has passed since then.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
