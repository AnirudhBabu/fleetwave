apiVersion: v1
kind: Namespace
metadata:
  name: fleetwave-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetwave
  namespace: fleetwave-system
  labels:
    app.kubernetes.io/name: fleetwave
spec:
  replicas: 2 # leader election: one active, one warm standby
  selector:
    matchLabels:
      app.kubernetes.io/name: fleetwave
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleetwave
    spec:
      serviceAccountName: fleetwave
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: fleetwave:dev # built by `make docker-build`; load it with `kind load docker-image`
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            initialDelaySeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
